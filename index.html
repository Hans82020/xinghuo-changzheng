;(function (XH) {
  // 像素地形层（march 底图）：河流折线 / 雪山符号 / 草地沼泽 / 省名标注
  // 画在 theme 之后、行军路线之前，坐标与 NODES.pos 同一 320×180 逻辑坐标系
  const RIVERS = [
    { name: '湘江',   pts: [[236,96], [231,116], [227,136], [222,156], [218,174]] },
    { name: '乌江',   pts: [[206,120], [202,136], [197,152], [192,168]] },
    { name: '赤水',   pts: [[185,128], [177,140], [169,150], [159,140], [153,154]] },  // 迂回河曲呼应四渡
    { name: '金沙江', pts: [[149,100], [141,120], [133,140], [123,158], [113,174]] },
    { name: '大渡河', pts: [[109,70], [105,86], [101,102], [97,120], [93,140]] },
  ];
  const PEAKS = [[80,58], [94,60], [76,66], [100,68], [70,60]];      // 夹金山一带雪峰顶点
  const MARSH = { x: 54, y: 36, w: 32, h: 17 };                       // 松潘草地
  const PROVINCES = [['江西', 268, 132], ['湖南', 239, 114], ['贵州', 197, 160],
    ['云南', 142, 166], ['四川', 101, 74], ['西康', 74, 92], ['甘肃', 125, 38]];
  const BLUE = '#3d6b9e', SNOW_TOP = '#e8edf2', SNOW_BODY = '#9aa7b5';

  XH.drawTerrain = (ctx) => {
    const R = XH.Render, C = XH.PALETTE;
    // 草地：暗绿块 + 沼泽斑驳点
    R.px(ctx, MARSH.x, MARSH.y, MARSH.w, MARSH.h, '#3b4d22');
    for (let i = 0; i < 14; i++) {
      const mx = MARSH.x + (i * 7 + 3) % MARSH.w, my = MARSH.y + (i * 5 + 2) % (MARSH.h - 2);
      R.px(ctx, mx, my, 2, 1, i % 2 ? '#55693a' : '#2a3a18');
    }
    // 河流：2px 折线（步进插值）
    for (const rv of RIVERS) {
      for (let i = 1; i < rv.pts.length; i++) {
        const a = rv.pts[i - 1], b = rv.pts[i];
        const dx = b[0] - a[0], dy = b[1] - a[1], n = Math.max(1, Math.max(Math.abs(dx), Math.abs(dy)));
        for (let s = 0; s <= n; s++)
          R.px(ctx, Math.round(a[0] + dx * s / n), Math.round(a[1] + dy * s / n), 2, 2, BLUE);
      }
    }
    // 雪峰：^ 形小三角（白雪顶 + 灰山体）
    for (const [x, y] of PEAKS) {
      R.px(ctx, x + 2, y, 1, 1, SNOW_TOP);
      R.px(ctx, x + 1, y + 1, 3, 1, SNOW_BODY);
      R.px(ctx, x, y + 2, 5, 1, SNOW_BODY);
    }
    // 省名：暗色小字
    for (const [name, x, y] of PROVINCES) R.text(ctx, name, x, y, { size: 7, color: C.textDim });
  };
})(globalThis.XH = globalThis.XH || {});

            st.lastBonus = 0;
            XH.State.beginNode(st, XH.NODES[i]);
            st.nodeIndex = i;
            XH.Loop.replace(XH.Scenes.march(st));
          }));
        } else if (st.nodeIndex >= XH.NODES.length) {
          XH.Loop.replace(XH.Scenes.report(st));
        }
        // 否则 summary 已自行 pop，栈顶自然回到 march
      }));
    },

    // 调试/T16 验收：新建 State 直接进入第 m 个节点流程（m：0~13），返回新建的 st
    __jump(m) {
      const idx = Math.max(0, Math.min(13, m | 0));
      const st = XH.State.create();
      st.nodeIndex = idx;
      XH.Loop.stack.length = 0;
      XH.Loop.push(XH.Scenes.march(st));                   // 底层 march：流程结束后可回
      XH.NodeFlow.start(st, XH.NODES[idx]);
      return st;
    },
  };
})(globalThis.XH = globalThis.XH || {});

/*== report.js ==*/
;(function (XH) {
  // 通关报告：用时 / 答题正确率 / 玩法星总数 / 笔记收集 / 兵力对比 + 结语三档 + 重新出发回 title
  XH.Scenes = XH.Scenes || {};
  XH.Scenes.report = (st) => {
    const R = () => XH.Render, C = () => XH.PALETTE;
    const total = XH.NODES.length;
    const ratio = ((st.notebook || []).length) / total;
    const avgRes = Math.round(((st.supply || 0) + (st.morale || 0) + (st.faith || 0)) / 3);
    const resWord = avgRes >= 70 ? '军民同心，粮弹充足'
      : avgRes >= 40 ? '艰苦奋斗，稳步前行' : '极端困苦，志愈弥坚';
    const word = ratio < 0.5 ? '长征永远在路上'
      : ratio < 0.9 ? '星星之火，正在燎原'
      : avgRes >= 70 ? '红军不怕远征难，万水千山只等闲' : '艰难困苦，玉汝于成';
    const stars = Object.keys(st.mgStars || {}).reduce((s, k) => s + (st.mgStars[k] || 0), 0);
    const mins = Math.floor((st.elapsedMs || 0) / 60000), secs = Math.floor((st.elapsedMs || 0) / 1000) % 60;
    const scene = {
      name: 'report', st, word,
      update() {},
      draw(ctx) {
        const R0 = R(), C0 = C();
        R0.px(ctx, 0, 0, 320, 180, C0.inkBlack);
        R0.panel(ctx, 20, 8, 280, 150);
        R0.text(ctx, '长 征 胜 利', 160, 16, { size: 14, align: 'center', color: C0.sparkGold });
        const rows = [
          '行军用时：' + mins + ' 分 ' + secs + ' 秒',
          '答题正确：' + (st.quizRight || 0) + ' / ' + (st.quizTotal || 0),
          '玩法星数：' + stars + ' / ' + total * 3,
          '党史笔记：' + ((st.notebook || []).length) + ' / ' + total,
          '出发 8.6 万 → 现在约 ' + XH.HUD.fmtTroops(st.troops || 0),
          '资源状况：' + resWord,
        ];
        rows.forEach((ln, i) => R0.text(ctx, ln, 40, 38 + i * 13, { size: 8, color: C0.textMain }));
        R0.panel(ctx, 44, 116, 232, 28);
        R0.text(ctx, word, 160, 126, { size: 9, align: 'center', color: C0.sparkGold });
        R0.text(ctx, '点击重新出发', 160, 166, { size: 8, align: 'center', color: C0.textMain });
      },
      onInput(e) {
        if (e.type !== 'tap' && !(e.type === 'key' && e.action === 'confirm')) return;
        XH.Save.clear(XH.Platform.storage);                // 新一局：清除旧存档
        XH.Loop.stack.length = 0;
        XH.Loop.push(XH.Scenes.title());
      },
    };
    return scene;
  };
})(globalThis.XH = globalThis.XH || {});

/*== main.js ==*/
;(function (XH) {
  // —— 浏览器唯一入口（Node 测试不加载本文件；本文件是唯一允许 document/addEventListener/location 的源码）——
  XH.DEBUG_LOCK = false;
  const canvas = document.getElementById('game');

  // 画布整数倍缩放适配窗口（保持像素风）
  function fit() {
    const s = Math.max(1, Math.floor(Math.min(window.innerWidth / 320, window.innerHeight / 180)));
    canvas.style.width = (320 * s) + 'px';
    canvas.style.height = (180 * s) + 'px';
  }
  window.addEventListener('resize', fit); fit();

  // 调试：?debug=1 时数字键 1~9/0 跳节点（XH.NodeFlow.__jump），F 键切 DEBUG_LOCK（负值归零锁）
  if (/(?:\?|&)debug=1/.test(window.location.search)) {
    window.addEventListener('keydown', e => {
      if (e.key >= '1' && e.key <= '9') XH.NodeFlow.__jump(e.key.charCodeAt(0) - 49);
      else if (e.key === '0') XH.NodeFlow.__jump(9);
      else if (e.code === 'KeyF') XH.DEBUG_LOCK = !XH.DEBUG_LOCK;
    });
  }

  // 首次交互初始化音频（浏览器自动播放策略：需用户手势后才能出声）
  const initAudio = () => {
    XH.Platform.audio.init();
    window.removeEventListener('pointerdown', initAudio);
    window.removeEventListener('keydown', initAudio);
  };
  window.addEventListener('pointerdown', initAudio);
  window.addEventListener('keydown', initAudio);

  XH.Loop.start(canvas);
  XH.Loop.push(XH.Scenes.title());
})(globalThis.XH = globalThis.XH || {});
